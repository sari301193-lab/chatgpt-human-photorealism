<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Reverse Engineer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="intro card">
        <p class="eyebrow">chatgpt-human-photorealism</p>
        <h1>Reverse engineer a photorealistic prompt</h1>
        <p>
          Capture the visual traits you see in a target image and reconstruct them into a reusable prompt.
        </p>
      </section>

      <section class="card form-card">
        <form id="prompt-form">
          <div class="grid">
            <label for="subject">
              <span>Subject</span>
              <input id="subject" name="subject" placeholder="e.g. a 28-year-old woman with freckles and short black hair" />
            </label>
            <label for="face">
              <span>Face and expression</span>
              <input id="face" name="face" placeholder="e.g. relaxed smile, direct eye contact, soft makeup" />
            </label>
            <label for="pose">
              <span>Pose and composition</span>
              <input id="pose" name="pose" placeholder="e.g. waist-up portrait, turned slightly left, centered framing" />
            </label>
            <label for="wardrobe">
              <span>Wardrobe and styling</span>
              <input id="wardrobe" name="wardrobe" placeholder="e.g. beige trench coat, gold hoop earrings" />
            </label>
            <label for="environment">
              <span>Environment</span>
              <input id="environment" name="environment" placeholder="e.g. rainy city street at night with neon reflections" />
            </label>
            <label for="lighting">
              <span>Lighting</span>
              <input id="lighting" name="lighting" placeholder="e.g. soft key light with warm rim light" />
            </label>
            <label for="camera">
              <span>Camera</span>
              <input id="camera" name="camera" placeholder="e.g. 85mm lens, shallow depth of field, crisp focus" />
            </label>
            <label for="mood">
              <span>Mood and color</span>
              <input id="mood" name="mood" placeholder="e.g. cinematic, moody blues and amber highlights" />
            </label>
          </div>

          <label for="details">
            <span>Fine details</span>
            <textarea id="details" name="details" rows="4" placeholder="e.g. visible skin pores, natural flyaway hairs, water droplets on jacket"></textarea>
          </label>

          <label for="quality">
            <span>Extra quality traits (comma or newline separated)</span>
            <textarea id="quality" name="quality" rows="3" placeholder="e.g. studio-grade realism, subtle imperfections"></textarea>
          </label>

          <label for="negative">
            <span>Negative prompt / things to avoid (comma or newline separated)</span>
            <textarea id="negative" name="negative" rows="3" placeholder="e.g. extra fingers, waxy skin, distorted eyes"></textarea>
          </label>

          <div class="actions">
            <button type="submit">Generate prompt</button>
            <button type="button" id="load-example" class="secondary">Load example</button>
          </div>
        </form>
      </section>

      <section class="card output-card">
        <div class="output-header">
          <h2 id="prompt-output-label">Generated prompt</h2>
          <button type="button" id="copy-output" class="secondary" aria-describedby="copy-status">Copy</button>
        </div>
        <p id="copy-status" class="sr-only" aria-live="polite"></p>
        <textarea id="prompt-output" rows="10" readonly aria-labelledby="prompt-output-label"></textarea>
        <h3>Prompt breakdown</h3>
        <ul id="prompt-breakdown"></ul>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
